name: Windows Free Installer CI

on:
  pull_request:
    branches: [prototype/free-pro-team]
    paths:
      - 'scripts/installer/**'
      - 'test/installer/**'
      - 'test/test-windows-free-installer-contract.js'
      - 'test/test-windows-free-installer-archive-security.js'
      - 'test/test-windows-free-installer-download-redirect.js'
      - 'test/test-windows-free-runtime-instance.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-free-package.cjs'
      - 'src/free-index.ts'
      - 'src/run-server.ts'
      - 'src/control-center/**'
      - 'src/remote-device/**'
      - '.github/workflows/windows-free-installer-ci.yml'
  push:
    branches: [prototype/free-pro-team]
    paths:
      - 'scripts/installer/**'
      - 'test/installer/**'
      - 'test/test-windows-free-installer-contract.js'
      - 'test/test-windows-free-installer-archive-security.js'
      - 'test/test-windows-free-installer-download-redirect.js'
      - 'test/test-windows-free-runtime-instance.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-free-package.cjs'
      - 'src/free-index.ts'
      - 'src/run-server.ts'
      - 'src/control-center/**'
      - 'src/remote-device/**'
      - '.github/workflows/windows-free-installer-ci.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, DesktopCommanderMCP]
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install development dependencies
        shell: powershell
        run: npm ci

      - name: Verify installer source contract
        shell: powershell
        run: node test/test-windows-free-installer-contract.js

      - name: Verify archive traversal and link entries fail closed
        shell: powershell
        run: node test/test-windows-free-installer-archive-security.js

      - name: Verify downloader redirect handling
        shell: powershell
        run: node test/test-windows-free-installer-download-redirect.js

      - name: Verify runtime single-instance ownership
        shell: powershell
        run: node test/test-windows-free-runtime-instance.js

      - name: Build and verify real Windows installer E2E
        shell: powershell
        run: node test/installer/windows-free-installer-e2e.test.js

      - name: Verify bundled native runtime dependencies
        shell: powershell
        run: node test/installer/windows-free-runtime-native-deps.test.js

      - name: Verify repository diff hygiene
        shell: powershell
        run: git diff --check
