name: Open Core Composition Proof

on:
  push:
    branches:
      - prototype/free-pro-team
      - feat/free-commercial-composition-proof
      - feat/open-core-extraction-readiness
      - feat/r3-public-paid-source-removal
  pull_request:
    branches:
      - prototype/free-pro-team

permissions:
  contents: read

concurrency:
  group: open-core-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composition-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public Free/shared tree
        run: npm run build

      - name: Prove paid source is physically absent
        run: node test/test-r3-public-source-boundary.js

      - name: Enforce public source dependency boundary
        run: node test/test-open-core-extraction-boundary.js

      - name: Enforce public documentation boundary
        run: node test/test-r3-public-docs-boundary.js

      - name: Verify public Commercial attachment contract
        run: node test/test-commercial-contract-v1.js

      - name: Verify public Control Center attachment contract
        run: node test/test-control-center-contract-v1.js

      - name: Verify Free entitlement boundary
        run: node test/test-capability-entitlements.js

      - name: Prove normal build removes stale paid output
        run: node test/test-r3-build-cleans-dist.js

      - name: Verify crash-safe config persistence
        run: node test/test-config-atomic-persistence.js

      - name: Verify Free composition
        run: node test/test-free-composition.js

      - name: Build, inspect, install and smoke Free package
        run: node test/test-free-package-artifact.js

      - name: Preserve Free presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-commander-free-proof-${{ github.sha }}
          path: |
            .artifacts/free/*.tgz
            .artifacts/free/package-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify public CI boundary
        run: node test/test-r3-public-ci-boundary.js

      - name: Diff whitespace check
        run: git diff --check origin/prototype/free-pro-team...HEAD
