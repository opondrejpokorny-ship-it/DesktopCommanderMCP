name: RDC A/B inspect stale journal identity

on:
  push:
    branches:
      - ops/rdc-ab-recover-online-20260911

permissions:
  contents: read

jobs:
  inspect-journal:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect journal PID identity from SYSTEM
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression (Get-Content -Raw '{0}')"
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\ondre\AppData\Local\RDC-Benchmark-20260908-c2234dd'
          $journalPath=Join-Path $root '.rdc-ab-runtime-namespace-seal.json'
          if(-not(Test-Path $journalPath)){throw 'Journal missing'}
          $j=Get-Content -Raw $journalPath|ConvertFrom-Json
          Write-Host "JOURNAL supervisorPid=$($j.SupervisorPid) supervisorStart=$($j.SupervisorStartUtc) childPid=$($j.ChildPid) childStart=$($j.ChildStartUtc) ownerSid=$($j.OwnerSid)"
          Write-Host "JOURNAL repo=$($j.Repository) entry=$($j.Entrypoint) rights=$($j.Rights)"
          foreach($pidValue in @([int]$j.SupervisorPid,[int]$j.ChildPid)){
            if($pidValue -le 0){continue}
            $p=Get-CimInstance Win32_Process -Filter "ProcessId=$pidValue" -ErrorAction SilentlyContinue
            if(-not $p){Write-Host "PID $pidValue ABSENT";continue}
            $owner=Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction SilentlyContinue
            Write-Host "PID $pidValue PRESENT creation=$($p.CreationDate) name=$($p.Name) ppid=$($p.ParentProcessId) sid=$($owner.Sid) exe=$($p.ExecutablePath) cmd=$($p.CommandLine)"
          }
          $allOld=@(Get-CimInstance Win32_Process|Where-Object{[string]$_.CommandLine -like '*RDC-Benchmark-20260908-c2234dd*'})
          Write-Host "EXACT_OLD_ROOT_VISIBLE_COUNT=$($allOld.Count)"
