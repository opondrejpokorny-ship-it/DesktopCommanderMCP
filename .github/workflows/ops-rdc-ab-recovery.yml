name: RDC A/B inspect current PART 3 handoff

on:
  push:
    branches:
      - ops/rdc-ab-recover-online-20260911

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Read-only current PART 3 diagnostics
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression (Get-Content -Raw '{0}')"
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\ondre\AppData\Local\RDC-Benchmark-20260912-1f9c8c4'
          $taskName='Codebase44 Remote Desktop Commander SYSTEM'
          $device='C:\Windows\System32\config\systemprofile\.desktop-commander-device\device.json'
          $all=Get-CimInstance Win32_Process
          $interesting=@($all | Where-Object {
            $cmd=[string]$_.CommandLine
            $cmd -and (
              $cmd -match 'RDC-Benchmark-20260912-1f9c8c4' -or
              $cmd -match 'Activate-RdcAbLauncher\.ps1' -or
              $cmd -match 'Run-RdcAbSupervisor\.ps1' -or
              $cmd -match 'rdc-ab-start-1f9c8c4\.cmd' -or
              $cmd -match 'DesktopCommanderTierPrototype.*dist\\index\.js'
            )
          })
          Write-Host "INTERESTING_COUNT=$($interesting.Count)"
          foreach($p in $interesting){
            $o=Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction SilentlyContinue
            $gp=Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
            Write-Host "PROC pid=$($p.ProcessId) ppid=$($p.ParentProcessId) name=$($p.Name) sid=$($o.Sid) created=$($p.CreationDate) cpu=$($gp.CPU) handles=$($gp.HandleCount) ws=$($gp.WorkingSet64) readOps=$($p.ReadOperationCount) readBytes=$($p.ReadTransferCount) writeOps=$($p.WriteOperationCount) writeBytes=$($p.WriteTransferCount) cmd=$($p.CommandLine)"
          }
          $remotes=@($all | Where-Object {
            $_.Name -eq 'node.exe' -and [string]$_.CommandLine -match 'dist\\index\.js.*remote'
          })
          Write-Host "REMOTE_COUNT=$($remotes.Count)"
          foreach($p in $remotes){
            $o=Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction SilentlyContinue
            $tcp=@(Get-NetTCPConnection -OwningProcess $p.ProcessId -ErrorAction SilentlyContinue | Select-Object State,RemoteAddress,RemotePort,LocalAddress,LocalPort)
            Write-Host "REMOTE pid=$($p.ProcessId) ppid=$($p.ParentProcessId) sid=$($o.Sid) created=$($p.CreationDate) tcpCount=$($tcp.Count) cmd=$($p.CommandLine)"
            foreach($t in $tcp){Write-Host "TCP pid=$($p.ProcessId) state=$($t.State) remote=$($t.RemoteAddress):$($t.RemotePort) local=$($t.LocalAddress):$($t.LocalPort)"}
          }
          $task=Get-ScheduledTask -TaskName $taskName
          $info=Get-ScheduledTaskInfo -TaskName $taskName
          Write-Host "TASK state=$($task.State) enabled=$($task.Settings.Enabled) lastRun=$($info.LastRunTime.ToString('o')) lastResult=$($info.LastTaskResult)"
          $activePath=Join-Path $root 'active-variant.txt'
          if(Test-Path -LiteralPath $activePath -PathType Leaf){Write-Host "ACTIVE=$((Get-Content -Raw -LiteralPath $activePath).Trim())"}
          $journalPath=Join-Path $root '.rdc-ab-runtime-namespace-seal.json'
          Write-Host "JOURNAL_EXISTS=$(Test-Path -LiteralPath $journalPath -PathType Leaf)"
          if(Test-Path -LiteralPath $journalPath -PathType Leaf){
            $j=Get-Content -Raw -LiteralPath $journalPath | ConvertFrom-Json
            foreach($name in @('SupervisorPid','SupervisorStartUtc','ChildPid','ChildStartUtc','OwnerSid','Repository','Entrypoint','Rights')){
              if($j.PSObject.Properties.Name -contains $name){Write-Host "JOURNAL_$name=$($j.$name)"}
            }
          }
          if(Test-Path -LiteralPath $device -PathType Leaf){
            $i=Get-Item -LiteralPath $device
            $j=Get-Content -Raw -LiteralPath $device | ConvertFrom-Json
            $access=[string]$j.session.access_token
            $expUtc=''
            if(-not [string]::IsNullOrWhiteSpace($access)){
              try {
                $parts=$access.Split('.')
                if($parts.Length -ge 2){
                  $p=$parts[1].Replace('-','+').Replace('_','/')
                  switch($p.Length % 4){2{$p+='=='}3{$p+='='}}
                  $payload=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($p))|ConvertFrom-Json
                  if($payload.exp){$expUtc=[DateTimeOffset]::FromUnixTimeSeconds([int64]$payload.exp).UtcDateTime.ToString('o')}
                }
              } catch { $expUtc='decode-error' }
            }
            Write-Host "DEVICE_META deviceId=$($j.deviceId) lastWriteUtc=$($i.LastWriteTimeUtc.ToString('o')) length=$($i.Length) hasAccess=$([bool](-not [string]::IsNullOrWhiteSpace($access))) hasRefresh=$([bool](-not [string]::IsNullOrWhiteSpace([string]$j.session.refresh_token))) accessExpUtc=$expUtc"
          }
          $runnerDiag='C:\actions-runner\_diag'
          if(Test-Path -LiteralPath $runnerDiag -PathType Container){
            Write-Host "RUNNER_DIAG_PRESENT=True"
          }
          Write-Host "RUNNER_IDENTITY=$([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          $browserNames=@('msedge.exe','chrome.exe','firefox.exe')
          $browsers=@(Get-CimInstance Win32_Process | Where-Object { $browserNames -contains $_.Name })
          Write-Host "BROWSER_COUNT=$($browsers.Count)"
          foreach($browser in $browsers){
            $o=Invoke-CimMethod -InputObject $browser -MethodName GetOwnerSid -ErrorAction SilentlyContinue
            $gp=Get-Process -Id $browser.ProcessId -ErrorAction SilentlyContinue
            $hint=([string]$browser.CommandLine -like '*desktopcommander*' -or [string]$browser.CommandLine -like '*authorize*' -or [string]$browser.CommandLine -like '*verify*')
            Write-Host "BROWSER pid=$($browser.ProcessId) ppid=$($browser.ParentProcessId) name=$($browser.Name) sid=$($o.Sid) session=$($gp.SessionId) created=$($browser.CreationDate) authUrlHint=$hint"
          }
          $consoleProbe = Join-Path $env:RUNNER_TEMP 'rdc-ab-console-probe.ps1'
          @'
Add-Type @"
using System;
using System.Text;
using System.Runtime.InteropServices;
public static class RdcAbConsoleProbe {
  [StructLayout(LayoutKind.Sequential)] public struct COORD { public short X; public short Y; public COORD(short x, short y){X=x;Y=y;} }
  [StructLayout(LayoutKind.Sequential)] public struct SMALL_RECT { public short Left; public short Top; public short Right; public short Bottom; }
  [StructLayout(LayoutKind.Sequential)] public struct INFO { public COORD Size; public COORD Cursor; public ushort Attr; public SMALL_RECT Window; public COORD Max; }
  [DllImport("kernel32.dll", SetLastError=true)] public static extern bool FreeConsole();
  [DllImport("kernel32.dll", SetLastError=true)] public static extern bool AttachConsole(uint pid);
  [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern IntPtr CreateFile(string n,uint a,uint s,IntPtr sec,uint c,uint f,IntPtr t);
  [DllImport("kernel32.dll", SetLastError=true)] public static extern bool GetConsoleScreenBufferInfo(IntPtr h, out INFO i);
  [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool ReadConsoleOutputCharacter(IntPtr h,StringBuilder b,uint n,COORD p,out uint r);
}
"@
[RdcAbConsoleProbe]::FreeConsole() | Out-Null
if(-not [RdcAbConsoleProbe]::AttachConsole(112)){ Write-Output 'CONSOLE_PROBE attached=False'; exit 0 }
$h=[RdcAbConsoleProbe]::CreateFile('CONOUT$',0x80000000,3,[IntPtr]::Zero,3,0,[IntPtr]::Zero)
$i=New-Object RdcAbConsoleProbe+INFO
if(-not [RdcAbConsoleProbe]::GetConsoleScreenBufferInfo($h,[ref]$i)){ Write-Output 'CONSOLE_PROBE attached=True read=False'; exit 0 }
$len=[int]$i.Size.X * [int]$i.Size.Y
$sb=New-Object Text.StringBuilder $len
$read=[uint32]0
[void][RdcAbConsoleProbe]::ReadConsoleOutputCharacter($h,$sb,[uint32]$len,[RdcAbConsoleProbe+COORD]::new(0,0),[ref]$read)
$text=$sb.ToString()
$prompt=$text -match 'Please complete authentication'
$waiting=$text -match 'Waiting for authorization'
$code=$text -match 'Enter this code when prompted'
$uri=$text -match 'Open this URL in your browser'
Write-Output "CONSOLE_PROBE attached=True read=True authPrompt=$prompt waiting=$waiting codeInstruction=$code uriInstruction=$uri"
'@ | Set-Content -LiteralPath $consoleProbe -Encoding UTF8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $consoleProbe
          Remove-Item -LiteralPath $consoleProbe -Force -ErrorAction SilentlyContinue
