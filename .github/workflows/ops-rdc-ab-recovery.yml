name: RDC A/B inspect activation handoff

on:
  push:
    branches:
      - ops/rdc-ab-recover-online-20260911

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect activation process and logs
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression (Get-Content -Raw '{0}')"
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\Codebase44\data\codebase44\rdc-system\ab-activate.stdout.log'
          $err='C:\Codebase44\data\codebase44\rdc-system\ab-activate.stderr.log'
          $all=Get-CimInstance Win32_Process
          $acts=@($all|Where-Object{[string]$_.CommandLine -match 'Activate-RdcAbLauncher\.ps1.*RDC-Benchmark-20260910-f800bcc'})
          Write-Host "ACTIVATION_COUNT=$($acts.Count)"
          foreach($p in $acts){Write-Host "ACT pid=$($p.ProcessId) ppid=$($p.ParentProcessId) name=$($p.Name) cmd=$($p.CommandLine)"}
          $remotes=@($all|Where-Object{$_.Name -eq 'node.exe' -and [string]$_.CommandLine -match 'dist\\index\.js.*remote'})
          Write-Host "REMOTE_COUNT=$($remotes.Count)"
          foreach($p in $remotes){$o=Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction SilentlyContinue;Write-Host "REMOTE pid=$($p.ProcessId) ppid=$($p.ParentProcessId) sid=$($o.Sid) cmd=$($p.CommandLine)"}
          if(Test-Path $out){Write-Host 'STDOUT_START';Get-Content -Raw $out|Write-Host;Write-Host 'STDOUT_END'}
          if(Test-Path $err){Write-Host 'STDERR_START';Get-Content -Raw $err|Write-Host;Write-Host 'STDERR_END'}
          $root='C:\Users\ondre\AppData\Local\RDC-Benchmark-20260910-f800bcc'
          Write-Host "ACTIVE=$((Get-Content -Raw (Join-Path $root 'active-variant.txt')).Trim())"
          Write-Host "JOURNAL=$(Test-Path (Join-Path $root '.rdc-ab-runtime-namespace-seal.json'))"
