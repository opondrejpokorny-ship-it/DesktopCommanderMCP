name: RDC A/B inspect stale cleanup state

on:
  push:
    branches:
      - ops/rdc-ab-recover-online-20260911

permissions:
  contents: read

jobs:
  inspect-cleanup:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect stale user launcher cleanup
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression (Get-Content -Raw '{0}')"
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\ondre\AppData\Local\RDC-Benchmark-20260908-c2234dd'
          $launcher='C:\Users\ondre\AppData\Local\DesktopCommanderRemote\start-remote.cmd'
          $backup=$launcher+'.rdc-ab-original'
          $vbs='C:\Users\ondre\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\DesktopCommanderRemote.vbs'
          $disabled=$vbs+'.rdc-retired-20260911'
          $failure='C:\Users\ondre\AppData\Local\Temp\rdc-ab-retire-stale-user.failure.txt'
          Write-Host "ACTIVE=$((Get-Content -Raw (Join-Path $root 'active-variant.txt')).Trim())"
          Write-Host "VBS_ENABLED=$(Test-Path -LiteralPath $vbs) VBS_DISABLED=$(Test-Path -LiteralPath $disabled)"
          Write-Host "LAUNCHER_SHA=$((Get-FileHash $launcher -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "BACKUP_SHA=$((Get-FileHash $backup -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "OLD_PROCESS_COUNT=$(@(Get-CimInstance Win32_Process | Where-Object { [string]$_.CommandLine -like '*RDC-Benchmark-20260908-c2234dd*' }).Count)"
          if(Test-Path -LiteralPath $failure){ Write-Host "FAILURE_MARKER=$(Get-Content -Raw $failure)" }
