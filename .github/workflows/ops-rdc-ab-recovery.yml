name: RDC A/B test elevated user visibility

on:
  push:
    branches:
      - ops/rdc-ab-recover-online-20260911

permissions:
  contents: read

jobs:
  test-user-high:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Test ondre Highest process visibility
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression (Get-Content -Raw '{0}')"
        run: |
          $ErrorActionPreference='Stop'
          $taskName='DC2 RDC A-B Test Elevated User Visibility 20260911'
          if(Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue){throw 'Temporary task already exists'}
          $scriptPath='C:\Users\ondre\AppData\Local\Temp\rdc-ab-test-elevated-visibility.ps1'
          $donePath='C:\Users\ondre\AppData\Local\Temp\rdc-ab-test-elevated-visibility.json'
          Remove-Item $donePath -Force -ErrorAction SilentlyContinue
          $payload=@'
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          try{$sid=$identity.User.Value}finally{$identity.Dispose()}
          $systemRemote=Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'node.exe' -and [string]$_.CommandLine -match 'DesktopCommanderTierPrototype.*dist\\index\.js.*remote' } | Select-Object -First 1
          $result=@{
            sid=$sid
            isAdmin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            found=[bool]$systemRemote
            commandVisible=([bool]([string]$systemRemote.CommandLine))
            pid=if($systemRemote){[int]$systemRemote.ProcessId}else{0}
          }
          [IO.File]::WriteAllText('C:\Users\ondre\AppData\Local\Temp\rdc-ab-test-elevated-visibility.json',($result|ConvertTo-Json -Compress),[Text.UTF8Encoding]::new($false))
          '@
          $payload=($payload -replace '(?m)^          ','')
          [IO.File]::WriteAllText($scriptPath,$payload,[Text.UTF8Encoding]::new($false))
          $action=New-ScheduledTaskAction -Execute 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -Argument ('-NoProfile -ExecutionPolicy Bypass -File "'+$scriptPath+'"')
          $principal=New-ScheduledTaskPrincipal -UserId 'ondre' -LogonType Interactive -RunLevel Highest
          $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 3) -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings | Out-Null
          try{
            Start-ScheduledTask -TaskName $taskName
            $deadline=[DateTime]::UtcNow.AddMinutes(2)
            do{Start-Sleep -Seconds 1}while(-not(Test-Path $donePath) -and [DateTime]::UtcNow -lt $deadline)
            if(-not(Test-Path $donePath)){throw 'Elevated user visibility task did not finish'}
            Write-Host "ELEVATED_USER_RESULT=$(Get-Content -Raw $donePath)"
          }finally{
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }
