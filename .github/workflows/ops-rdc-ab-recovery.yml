name: RDC A/B retire stale user harness

on:
  push:
    branches:
      - ops/rdc-ab-recover-online-20260911

permissions:
  contents: read

jobs:
  arm-retirement:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Arm stale user supervisor for graceful retirement
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression (Get-Content -Raw '{0}')"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'WIN-A0OFGC4ORFI') { throw 'Unexpected runner host' }

          $expectedSid = 'S-1-5-21-3352991977-3764762469-2652498129-1001'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try { $sid = $identity.User.Value } finally { $identity.Dispose() }
          if ($sid -ne $expectedSid) { throw "Unexpected runner SID: $sid" }

          $root = 'C:\Users\ondre\AppData\Local\RDC-Benchmark-20260908-c2234dd'
          $activePath = Join-Path $root 'active-variant.txt'
          $launcher = 'C:\Users\ondre\AppData\Local\DesktopCommanderRemote\start-remote.cmd'
          $metadataPath = Join-Path $root 'host\launcher-install.json'

          $acl = Get-Acl -LiteralPath $root
          if ($acl.Owner -ne 'WIN-A0OFGC4ORFI\ondre' -or -not $acl.AreAccessRulesProtected) {
            throw 'Stale benchmark root owner/ACL is not exact'
          }
          if ((Get-Content -Raw $activePath).Trim() -ne 'prototype') {
            throw 'Stale benchmark is not currently prototype-selected'
          }

          $metadata = Get-Content -Raw $metadataPath | ConvertFrom-Json
          if ([int]$metadata.schemaVersion -ne 1 -or
              -not ([string]$metadata.launcherPath).Equals($launcher, [StringComparison]::OrdinalIgnoreCase) -or
              [string]$metadata.backupSha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Stale launcher metadata is not exact'
          }

          $related = @(Get-CimInstance Win32_Process | Where-Object {
            [string]$_.CommandLine -like '*RDC-Benchmark-20260908-c2234dd*'
          })
          $supervisors = @($related | Where-Object {
            $_.Name -eq 'powershell.exe' -and [string]$_.CommandLine -like '*Run-RdcAbSupervisor.ps1*'
          })
          $remotes = @($related | Where-Object {
            $_.Name -eq 'node.exe' -and [string]$_.CommandLine -match 'dist\\index\.js.*remote'
          })
          if ($supervisors.Count -ne 1 -or $remotes.Count -ne 1) {
            throw "Unexpected stale harness topology: supervisors=$($supervisors.Count) remotes=$($remotes.Count)"
          }

          $temp = "$activePath.retire-$PID"
          [IO.File]::WriteAllText($temp, ('retire-pending' + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          Move-Item -LiteralPath $temp -Destination $activePath -Force
          if ((Get-Content -Raw $activePath).Trim() -ne 'retire-pending') {
            throw 'Failed to arm stale harness retirement'
          }

          Write-Host "STALE_HARNESS_RETIREMENT_ARMED supervisorPid=$($supervisors[0].ProcessId) remotePid=$($remotes[0].ProcessId)"
