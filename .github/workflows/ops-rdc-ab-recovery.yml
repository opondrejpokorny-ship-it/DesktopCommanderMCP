name: RDC A/B inspect live state

on:
  push:
    branches:
      - ops/rdc-ab-recover-online-20260911

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect RDC processes and authorities
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression (Get-Content -Raw '{0}')"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "HOST=$env:COMPUTERNAME IDENTITY=$(whoami)"
          $all = Get-CimInstance Win32_Process
          $remotes = @($all | Where-Object { $_.Name -eq 'node.exe' -and [string]$_.CommandLine -match 'dist\\index\.js.*remote' })
          Write-Host "REMOTE_COUNT=$($remotes.Count)"
          foreach ($p in $remotes) {
            $o = Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction SilentlyContinue
            Write-Host "REMOTE pid=$($p.ProcessId) ppid=$($p.ParentProcessId) sid=$($o.Sid) cmd=$($p.CommandLine)"
          }
          $old = @($all | Where-Object { [string]$_.CommandLine -like '*RDC-Benchmark-20260908-c2234dd*' })
          Write-Host "OLD_ROOT_PROCESS_COUNT=$($old.Count)"
          foreach ($p in $old) {
            $o = Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction SilentlyContinue
            Write-Host "OLD pid=$($p.ProcessId) ppid=$($p.ParentProcessId) name=$($p.Name) sid=$($o.Sid) cmd=$($p.CommandLine)"
          }
          $task = Get-ScheduledTask -TaskName 'Codebase44 Remote Desktop Commander SYSTEM' -ErrorAction Stop
          $info = Get-ScheduledTaskInfo -TaskName 'Codebase44 Remote Desktop Commander SYSTEM' -ErrorAction Stop
          Write-Host "SYSTEM_TASK state=$($task.State) lastResult=$($info.LastTaskResult) lastRun=$($info.LastRunTime.ToString('o'))"
          $vbs='C:\Users\ondre\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\DesktopCommanderRemote.vbs'
          Write-Host "USER_STARTUP_VBS_EXISTS=$(Test-Path -LiteralPath $vbs)"
          $oldRoot='C:\Users\ondre\AppData\Local\RDC-Benchmark-20260908-c2234dd'
          if(Test-Path -LiteralPath $oldRoot){
            Write-Host "OLD_ACTIVE=$((Get-Content -Raw (Join-Path $oldRoot 'active-variant.txt')).Trim())"
            Write-Host "OLD_OWNER=$((Get-Acl -LiteralPath $oldRoot).Owner)"
          }
