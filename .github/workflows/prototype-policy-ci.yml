name: Policy Engine RED-GREEN

on:
  push:
    branches:
      - prototype/free-pro-team

permissions:
  contents: read

jobs:
  policy-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run policy engine test
        run: node test/test-tier-policy-engine.js
