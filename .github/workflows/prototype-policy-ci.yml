name: Policy Engine RED-GREEN

on:
  push:
    branches:
      - prototype/free-pro-team
      - feat/r3-public-paid-source-removal
  pull_request:
    branches:
      - prototype/free-pro-team

permissions:
  contents: read

concurrency:
  group: policy-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public Free/shared tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public Free/shared tree
        run: npm run build

      - name: Verify workflow control-plane core safety
        run: node test/test-project-workflow-coordinator.js

      - name: Verify Active Work enforcement over real MCP
        run: node test/integration/active-work-enforcement.js

      - name: Verify progress enforcement over real MCP
        run: node test/integration/progress-enforcement.js

      - name: Verify Commercial hook cannot mutate Free-validated arguments
        run: node test/integration/r3-commercial-hook-core-safety.js

      - name: Verify upstream command and filesystem guardrails
        run: |
          node test/test-blocked-commands.js
          node test/test-allowed-directories.js
          node test/test-symlink-security.js

      - name: Verify Free entitlement cannot activate paid capabilities
        run: node test/test-capability-entitlements.js

      - name: Diff whitespace check
        run: git diff --check origin/prototype/free-pro-team...HEAD
