name: Policy Engine RED-GREEN

on:
  push:
    branches:
      - prototype/free-pro-team

permissions:
  contents: read

concurrency:
  group: policy-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run focused policy tests
        shell: bash
        run: |
          for test_file in test/test-tier-*.js; do
            node "$test_file"
          done

      - name: Run real MCP policy integrations
        shell: bash
        run: |
          for test_file in test/integration/policy-*.js; do
            node "$test_file"
          done
