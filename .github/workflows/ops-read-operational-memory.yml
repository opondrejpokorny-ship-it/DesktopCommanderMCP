name: Ops Read Operational Memory

on:
  push:
    branches:
      - ops/read-operational-memory-20260904

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Read sanitized operational memory metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE '.claude-server-commander\project-workflow'
          Write-Host ('MACHINE=' + $env:COMPUTERNAME)
          Write-Host ('MEMORY_ROOT_EXISTS=' + (Test-Path $root))
          if (-not (Test-Path $root)) { exit 0 }
          $files = @(Get-ChildItem -LiteralPath $root -Filter '*.memory.jsonl' -File)
          Write-Host ('MEMORY_FILE_COUNT=' + $files.Count)
          $total = 0
          foreach ($file in $files) {
            $lines = @(Get-Content -LiteralPath $file.FullName | Where-Object { $_.Trim().Length -gt 0 })
            $total += $lines.Count
            Write-Host ('FILE=' + $file.Name + ' RECORDS=' + $lines.Count + ' MODIFIED=' + $file.LastWriteTime.ToString('o'))
            foreach ($line in $lines) {
              try {
                $obj = $line | ConvertFrom-Json
                $kind = if ($obj.kind) { [string]$obj.kind } else { '<none>' }
                $reasonCode = if ($obj.reasonCode) { [string]$obj.reasonCode } else { '<none>' }
                $lessonCode = if ($obj.lessonCode) { [string]$obj.lessonCode } else { '<none>' }
                $occurrences = if ($obj.occurrences) { [string]$obj.occurrences } else { '1' }
                $timestamp = if ($obj.timestamp) { [string]$obj.timestamp } elseif ($obj.createdAt) { [string]$obj.createdAt } elseif ($obj.recordedAt) { [string]$obj.recordedAt } else { '<none>' }
                Write-Host ('RECORD kind=' + $kind + ' reasonCode=' + $reasonCode + ' lessonCode=' + $lessonCode + ' occurrences=' + $occurrences + ' timestamp=' + $timestamp)
              } catch {
                Write-Host 'RECORD parse_error=true'
              }
            }
          }
          Write-Host ('TOTAL_RECORDS=' + $total)
          Write-Host 'OPS_MEMORY_READ_COMPLETE'
