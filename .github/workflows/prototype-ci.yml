name: Prototype CI

on:
  push:
    branches:
      - prototype/free-pro-team
  pull_request:
    branches:
      - main
      - prototype/free-pro-team

permissions:
  contents: read

concurrency:
  group: prototype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean upstream mirror
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run upstream test suite
        run: npm test

  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prototype test suite
        run: npm test
      - name: Run workflow MCP integrations
        run: |
          node test/integration/project-workflow.js
          node test/integration/operational-memory-restart.js
          node test/integration/project-workflow-opportunistic.js
          node test/integration/project-workflow-finalization.js
